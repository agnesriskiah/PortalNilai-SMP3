<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bgAdmin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="skin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fdba74"/>
    </linearGradient>
    <linearGradient id="tie" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
  </defs>

  <!-- Background Circle -->
  <circle cx="120" cy="120" r="116" fill="url(#bgAdmin)" stroke="#38bdf8" stroke-width="4"/>

  <!-- Admin Badge Gear Icon Background -->
  <circle cx="190" cy="50" r="24" fill="#0284c7" opacity="0.8"/>
  <path d="M190 38 L190 62 M178 50 L202 50" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>

  <!-- Suit / Clothes -->
  <path d="M50 240 C50 178 80 162 120 162 C160 162 190 178 190 240 Z" fill="#334155"/>
  <path d="M92 240 L104 182 L120 196 L136 182 L148 240 Z" fill="#ffffff"/>
  <!-- Necktie -->
  <polygon points="120,195 126,204 124,240 116,240 114,204" fill="url(#tie)"/>

  <!-- Neck -->
  <rect x="106" y="136" width="28" height="34" rx="4" fill="url(#skin)"/>

  <!-- Head -->
  <ellipse cx="120" cy="110" rx="42" ry="48" fill="url(#skin)"/>

  <!-- Hair (Professional short cut) -->
  <path d="M78 102 C76 68 96 52 120 52 C144 52 164 68 162 102 C152 82 136 78 120 78 C102 78 86 86 78 102 Z" fill="#1e293b"/>

  <!-- Glasses (Admin IT Style) -->
  <rect x="90" y="100" width="24" height="16" rx="4" fill="none" stroke="#0284c7" stroke-width="3"/>
  <rect x="126" y="100" width="24" height="16" rx="4" fill="none" stroke="#0284c7" stroke-width="3"/>
  <line x1="114" y1="108" x2="126" y2="108" stroke="#0284c7" stroke-width="3"/>

  <!-- Eyes -->
  <circle cx="102" cy="108" r="3" fill="#0f172a"/>
  <circle cx="138" cy="108" r="3" fill="#0f172a"/>

  <!-- Smile -->
  <path d="M108 132 Q120 142 132 132" fill="none" stroke="#9a3412" stroke-width="2.5" stroke-linecap="round"/>
</svg>
